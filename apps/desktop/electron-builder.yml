appId: com.akari.app
productName: Akari
copyright: Copyright © 2026 Akari
icon: build/icon.ico
directories:
  output: dist-electron
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - build/icon.ico
  - build/icon.png
extraResources:
  - from: ../server/dist
    to: server
    filter:
      - '**/*'
      - '!node_modules'
  - from: ../server/dist/node_modules
    to: server/node_modules
    filter:
      - '**/*'
  - from: ../web/dist
    to: web/dist
    filter:
      - '**/*'
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
